name: Issue 33 backup tests
on:
  pull_request:
    paths:
      - 'tools/issue33-backup/**'
      - '.github/workflows/issue33-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backup tests
        run: python3 -m unittest discover -s tools/issue33-backup -p 'test_*.py' -v
