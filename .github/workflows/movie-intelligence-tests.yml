name: Movie Intelligence Node Tests

on:
  pull_request:
    paths:
      - "tools/movie-intelligence/**"
      - ".github/workflows/movie-intelligence-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/movie-intelligence/**"
      - ".github/workflows/movie-intelligence-tests.yml"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run offline Movie Intelligence tests
        working-directory: tools/movie-intelligence
        env:
          SEERR_BASE_URL: ""
          SEERR_API_KEY: ""
          RADARR_BASE_URL: ""
          RADARR_API_KEY: ""
          MOVIE_DB_PATH: ""
        run: node --test test/*.test.mjs
