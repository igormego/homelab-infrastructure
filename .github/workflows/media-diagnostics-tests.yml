name: Media Read-only Diagnostics Tests

on:
  pull_request:
    paths:
      - "tools/media-diagnostics/**"
      - ".github/workflows/media-diagnostics-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/media-diagnostics/**"
      - ".github/workflows/media-diagnostics-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run read-only diagnostic fixtures
        working-directory: tools/media-diagnostics
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s . -p 'test_*.py'
