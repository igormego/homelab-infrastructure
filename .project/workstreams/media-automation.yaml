plex_watched_history_backfill:
  status: "Read-only live preflight complete; Plex historical watched-state auto-backfill not indicated by user intent"
  reported_on: "2026-10-20"
  scope: "Owner-account main Movies library only; temporary diagnostic library excluded."
  plex_inventory: "49 movies, 6 watched, 43 unwatched; 13 metadata items have lastViewedAt, not proof of completed viewing; 48/49 have TMDb+IMDb+Plex movie GUID. API yielded 13 owner playback history records."
  media_db_inventory: "687 movies, 561 watched at preflight; historical Trakt backfill of 558 movies remains previously accepted and is not reopened."
  comparison: "Five positive TMDb+IMDb matches: 3 watched both, 2 media.db watched but Plex unwatched. Three Plex-watched entries have no unambiguous media.db linkage; 44 Plex items have no direct external-ID match; 553 watched media.db entries with IDs lack matching currently held Plex files and 3 watched entries lack external IDs. Absence from current library does not establish historical absence."
  candidates: "28 Days Later (2002), TMDb 170/IMDb tt0289043: Plex unwatched, media.db watched, no Plex resume/history/timestamp; media.db watched_at 2024-05-20 with unverified provenance. Dune (2021), TMDb 438631/IMDb tt1160419: unwatched in Plex but has existing timestamp and resume 38:28; excluded from first write."
  intent_clarification: "2026-10-20 user clarified local Plex inventory includes newly downloaded, not-yet-seen films and planned rewatches, many not yet in CSFD want-to-see. A movie can be lifetime watched in media.db while usefully Unwatched in Plex. Thus current differences are not necessarily data errors; no reconciliation should force equal watched flags."
  watched_shelf_policy_decision: "2026-10-20 clarified intended simplest lifecycle: catalog previously watched movie identities in Radarr as unmonitored/no-file where appropriate; deleting only the main media file must not remove Radarr movie metadata; a re-download makes the title active again, and deleting the copy returns it to a watched-history shelf. Keep downloaded films and intentionally retained real franchise/trilogy members (e.g. 28 Days Later) in the active rotation. No rewatch flag, no mass Plex watched-state writes or implicit download/deletion."
  collection_scope_clarification: "No special franchise/trilogy retention automation is needed. User manually keeps film files (including series such as 28 Days Later) until choosing to delete them; dynamic Kometa editorial collections also do not govern retention. No file deletions authorized."
  example_titles: "User reports Radarr Unmonitored entries One Battle After Another, Heretic and Malignant; only Malignant seems to remain in Plex, but manual Plex removal is possible. Need read-only comparison before inferring Plex trash policy."
  postponed: "Genre-based subdivisions of historical Watched shelf are a nice-to-have after first shelf works; do not scope them into next task."
  radarr_state_caveat: "Unmonitored in Radarr disables automatic release monitoring; it does not mean watched or imply no file. A watched archive Radarr filter needs no-file AND unmonitored with lifetime watched sourced from media.db/Trakt. Radarr retains catalog metadata without media until movie itself is removed; Plex movie metadata behavior depends on its trash/scan settings, and Plex UI cannot necessarily show all Radarr-only films. Metadata provenance and historical watch dates remain separate in media.db/Trakt."
  exclusions: "Initial migration excludes older Agatha Christie titles until their identity/history discrepancies are reviewed; newer remakes may be handled normally. Exact film scope must be resolved before import."
  implementation_constraint: "Plex server movie collections reference existing library items, so deleted movies cannot simply remain as server-library collection members. Plex account Lists (2026) can include Discover titles without local files, but official supported-client list currently excludes Samsung Tizen; programmable List sync is unverified. Choose simplest genuinely Samsung-accessible shelf implementation after a bounded feasibility test."
  date_contract: "Documented Plex /:/scrobble changes played flag without creating playback history; no documented historical datetime argument. Plex profile/activity feed supports manual Edit Watched Date for account-side history when applicable, but equivalence to server watchedAt/history and programmable import remains unproven. Legacy placeholder dates are useful approximation only when explicitly labeled; do not silently promote to actual watch events."
  first_write_gate: "2026-10-20 user clarified 28 Days Later was watched long ago on VHS but recently downloaded for a possible rewatch; current Plex Unwatched is intentional/useful. Withdraw this item as first-write candidate. No automatic media.db watched -> Plex scrobble; no other writes authorized."
  shelf_request_idea: "Future My Cinema vision: browse watched posters absent from local Plex library and issue Seerr re-requests; Plex native library watched marks are not a permanent catalog of deleted movies. Plex Watchlist -> Seerr auto request may supply a limited, opt-in request path, but automatic 4K requests and watched-library separation require design."
  preservation: "Preflight read-only: no Plex, Trakt, ledger, service or repository code/config changes; Mortgully ambiguous Trakt POST remains no-retry."
  next_action: "Focused read-only parity check for known Radarr unmonitored titles One Battle After Another, Heretic and Malignant: compare hasFile/monitoring in Radarr against Plex retained/trash/unavailable presence and current Empty trash automatically after every scan setting; inspect whether items were manually removed or have never entered Plex (unknown unless evidence). Confirm Samsung-visible retention mechanism, and note that Plex trash alone cannot create 550+ never-imported historical titles. No deletions, trash emptying, scan, imports, requests or writes. Decide single controlled shelf proof-of-concept after results."

