plex_samsung_playback_investigation:
  status: "Open - root cause unknown"
  reported_on: "2026-10-18"
  affected: "The Secret Life of Walter Mitty (2013), original Plex item 354, Samsung Plex for Tizen; local connection without Relay."
  original: "With Force Direct Play off, original H.264 copy + DTS 5.1 to AAC 5.1 over MP4/DASH repeatedly buffered with embedded or external English SRT. Without subtitles the original played during observed tests; forced Direct Play previously lacked audio."
  diagnostic_copy: "Separate full-length remux in temporary non-ARR Plex library, item 1138: original H.264/DTS/regular SRT copied, AAC-LC 5.1 at 512 kb/s added, 36 chapters. DTS and AAC tests both buffered. AAC case observed 20 seconds buffering at 03:34.523 with H.264/AAC/SRT all copy over MP4/DASH. Copy also proved unreliable without subtitles."
  uncertainty: "Remux not established as valid control: complete timestamp/index validation missing; 21 ms relative stream start offset observed without demonstrated causal connection. AAC is not established as a fix; the file-specific or client/delivery contribution remains unknown."
  remux_validation: "2026-10-19: both files have usable SeekHead/Cues; diagnostic remux has 126519 clusters vs 10525 original and notably different packet interleaving. Video packet PTS offset +21 ms is constant across 2890 matching packets; causality and full timing integrity unproven."
  instrumented_original_observation: "2026-10-19: 3-minute bounded observation (72 session samples) of original with embedded regular English SRT. Samsung reported unexpected playback error after stalls at 22:23.503 and 23:16.942. All 23 observed segment requests had HTTP 200 replies; final logged segment reply completed 15:40:26.686 local time, with no later segment requests in captured server log though control requests continued. Segments remained available and later accumulated. Plex API remained in buffering even after TV showed an error. No root cause established."
  interpretation: "Server logs favor investigating Samsung client playback/request behavior over failed HTTP responses, but HTTP 200 does not prove successful decode and an absent server request does not prove the client never transmitted it; validate actual segment content or transport only if client logging leaves a meaningful gap."
  samsung_client_logs: "2026-10-19: client messages reached Plex Media Server.log; Samsung Plex 5.94.1 on Tizen 9. Item 354 playing near 21:23 at 15:52:15, SRT decoder reported 15 successful subtitles, buffering at 21:36.366 by 15:52:30; still stalled at 15:53:20. HTMLPlayer play() interrupted by pause() logged at 15:53:25 after stall, not proof of root cause. Client stopped playback at 15:54:11. No explicit decoder, DASH, MediaSource, SourceBuffer, subtitle-parser, JavaScript exception or unhandled rejection found. Older 23 HTTP 200 replies were from a different session. Startup issues are intermittently reported but not proven related."
  next_action: "No further same-instrumentation playback attempts. Disable Samsung Advanced > Log to Media Server, retain a locally sanitized correlated evidence bundle and contribute a precise report to the existing 2026-09-30 Plex forum Samsung SRT/audio-transcode stall thread; request deeper player instrumentation (HTMLMediaElement.error, buffered ranges, playback error code). Similar forum case is not proof of same cause. If Plex asks for further reproduction, scope it to the missing client telemetry. No ARR profile changes."
  preservation: "Original unchanged; diagnostic copy retained. No service, playback setting or ARR profile changes reported."

