  Scheduled execution and daily/Thursday rotation are runtime accepted; the Trending
  minimum-size correction is component-tested, with natural live recurrence optional.
  Home/Recommended publishing remains optional and requires active Plex Pass.
  The Mortgully delivery remains durably ambiguous after exactly
  one POST and two zero-result read-backs; automatic retry is forbidden. The saved POST
  audit was unavailable in the current Codex workspace and live inspection could not run
  because the required homelab SSH alias was unavailable, so non-creation is not proven.
  Public-indexer torrent cleanup is now accepted end-to-end on a fresh Radarr/Knaben grab:
  the one-minute seed goal propagated, qBittorrent stopped after 70 seconds, Radarr imported
  the movie and then removed the torrent job and download-side content.
  Separately, Samsung playback of Walter Mitty with SRT remains unresolved; DTS/AAC
  remux comparison is inconclusive because the copy buffers even with AAC copy
  and sometimes without subtitles. No acquisition-profile change is justified.

current_state: >
  Five Movies discovery collections have October 16 counts 2/3/1/4/20, stable
  sort order and deterministic persisted daily/weekly selection. Existing director
  browsing collections remain intact; TV and overlays are still outside Kometa scope.
  The first real media.db -> Trakt delivery reached a safe ambiguous checkpoint for
  Mortgully: The Last Rickforest. A durable in_flight delivery was created and exactly
  one Trakt history POST was attempted. The POST result could not be confirmed, and both
  the immediate item-specific read-back and a subsequent read-only reconciliation found
  zero matching history events. No Trakt history ID was captured, duplicate count is zero,
  and the delivery is durably marked ambiguous. No Plex writes or unexpected DB changes
  occurred and PRAGMA quick_check passed. The POST must not be retried automatically.
  Plex, Tautulli, Trakt, Seerr, Radarr/Sonarr, Movie Intelligence/media.db, media
  identity, watch history and media policy remain owned by the Homelab/Media domain.
  Personal AI Brain may consume them only through bounded capabilities; it owns reusable
  delivery, cursor, permission, audit and adapter-boundary patterns, not Media semantics.
  The next boundary is to inspect the sanitized original POST response/audit only; an
  explicit single retry may be considered only if that evidence definitively proves that
  Trakt did not create the event. The one-minute public torrent cleanup policy is now
  accepted end-to-end for qualifying public-indexer ARR grabs; Sk-CzTorrent remains outside
  that policy until its seeding requirements are known.

exact_next_action: >
  Optionally observe natural Trending below-minimum deletion/recovery and gather feedback on the
  five Movies collections. Do not add remaining Movies concepts or TV v2 implicitly.
  Plex Pass is only a prerequisite for optional future Home/Recommended publishing.
  Keep the independent Trakt boundary unchanged:
  Inspect only the sanitized original Mortgully POST response/audit and classify the
  ambiguous attempt. Do not issue another POST. If the saved response definitively proves
  not_found/added=0/no event created, surface that as evidence for one explicit retry
