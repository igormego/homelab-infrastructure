remote_access_issue_41:
  status: "Verified"
  last_verified: "2026-11-04"
  issue: "https://github.com/igormego/homelab-infrastructure/issues/41"
  verified:
    - "Windows notebook and Ubuntu server use NordVPN Meshnet with the existing SSH key and strict original host-key trust; the separate machine-local alias is retained."
    - "The operator confirmed the Ubuntu peer online on mobile hotspot. The original direct home LAN route was absent, and the correct Meshnet endpoint used the Nord interface."
    - "Ten sequential hotspot TCP 22 and key-based SSH probes passed with six-second pauses; TCP 47-154 ms and SSH command 550-988 ms. The server reported the notebook peer connected."
    - "After the operator disconnected and reconnected the hotspot, three further TCP and SSH read-only probes passed."
    - "After returning to the home LAN, canonical SSH and SSH, Docker and NordVPN services were active; container IDs matched the preserved baseline."
    - "On 2026-11-03 a hotspot SSH timeout occurred between successful probes; its cause remains unknown. The 2026-11-04 sample does not prove future or unattended reliability."
    - "Existing SSH baseline permits password and public-key authentication; root password login prohibited and keyboard-interactive disabled. No SSH or network configuration changes were made during this reliability check."
  acceptance:
    off_lan_tested: true
    off_lan_ssh_passed: true
    operator_interactive_travel_ssh: "accepted within the observed mobile-hotspot test scope"
    unattended_reliability: "Unknown"
    startup_reconnect_verified: true
  exact_next_action: "Use the existing separate Meshnet alias for interactive travel SSH; investigate if the previously observed intermittent timeout recurs."
  rollback: "Disable server Meshnet with nordvpn set meshnet off; pre-change inventory retained privately on host. Existing SSH key and canonical alias preserved."

backup_issue_33:
  status: "Blocked"
  last_verified: "2026-11-06"
  issue: "https://github.com/igormego/homelab-infrastructure/issues/33"
  verified:
    - "Authenticated read-only Meshnet SSH succeeded from the operator's external network."
    - "Thirteen active containers were inventoried across media, monitoring, agent control and trading workloads; persistent state also includes host paths and three named Docker volumes."
    - "A separate approximately 2 TB USB disk with an unmounted NTFS partition is present; its identity as the historical rollback disk, contents, health, writable capacity and suitability are unverified."
    - "Visible non-media application directories total roughly 19 GiB excluding selected caches; this is an incomplete estimate and does not include all privileged host state."
    - "SQLite-related database and WAL files exist in several application and agent state directories; a consistent snapshot method and isolated restore have not been tested."
    - "No noninteractive sudo is available; rsync, sqlite3 and gpg are installed, but restic and borg were not found on PATH."
  backup_executed: false
  restore_tested: false
  blocker: "No independently verified writable separate destination: the candidate NTFS disk is unmounted, its identity and existing rollback contents are unverified, and no mount change was authorized."
  exact_next_action: "Obtain owner approval for a narrowly scoped read-only inspection of the candidate disk and interactive privilege, or identify a different approved separate backup destination; preserve all existing data."
  remaining_prerequisites: "Verify physical disk identity, health, free capacity and existing contents; define complete application-aware snapshots, encrypted versioned repository, off-disk key recovery and isolated restoration before any backup write."
