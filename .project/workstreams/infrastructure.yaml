  All 26 original tests plus 11 normalized-schema tests pass locally. The
  supplied schema contract was used without homelab contact or deployment.
  Issue 9 is implemented and merged through PR 10 at merge commit dd795e3.
  tools/movie-intelligence now provides a source-separated get_movie_status
  contract, read-only SQLite and GET-only Radarr adapters, stable-ID identity
  rules and deterministic local tests; 26 tests passed in the implementation
