schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Homelab & Media Stack"
  workstream: "Infrastructure & Agent Control Plane"
  owner: "Homelab Infrastructure specialist chat"

status: "active"
phase: "post-migration-operations-and-agent-control-plane"

current_gate: >
  Stable identity is verified for all 40 candidates. Read-only history
  preflight proposes 39 safe entries and excludes one unresolved Plex link.
  No history writes are authorized by this gate.

current_state: >
  Verified follow-up: all five previously excluded records now have confirmed TMDb and IMDb mappings, bringing the identity-qualified cohort to 40. Exact source metadata, credits and release history resolved festival/distribution year differences and rejected wrong-work hints. Existing external_ids was reused with a fresh SQLite-aware backup, disposable rehearsal, transactional invariant checks and reopened verification: 10 additive rows, no schema changes, no collisions, all pre-existing rows unchanged. A read-only history preflight qualified 39 proposals: two Plex-confirmed dates and 37 legacy placeholders; one unresolved Plex linkage is excluded. Zero cohort titles already exist in Trakt. All six previously accepted Trakt events remain unchanged and excluded. No Trakt/Plex/watch-date writes occurred.
  Earlier checkpoints below are historical.
  Issue 17 verified completion on 2026-09-27 at 19:04 UTC. Seerr request 2 is
  completed (status 5); Radarr has_file=true and matching queue is empty.
  Imported Bluray-2160p file 246, 23434594215 bytes, added 15:49:03 UTC,
  exists at the managed path with matching size. Plex returns Whiplash (2014),
  TMDb 244786, and the same media file. Visibility, not playback, is verified.
  No live mutations occurred. The following Issue 16 checkpoint is historical.
  On 2026-09-27 the owner approved Phase A, which resolved Whiplash (2014)
  uniquely to TMDb 244786 with requestable preflight and no mutation.
  Phase B used merged 7902349 in transient Node v24.21.0, normalized read-only
  SQLite. One wrapper-mediated Seerr POST and identity read-back succeeded:
  request 2, status 2 approved, audit timestamp 15:29:53.886Z.
  Radarr has the matching monitored movie with has_file=false and downloading
  queue status OK. Existing default profile/root match. No direct ARR writes,
  configuration changes or persistent services were introduced. Import and
  Plex visibility are pending. The following Issue 14/13 details are historical.
  Issue 14 adds dry-run planning, stable TMDb resolution, source-separated
  preflight, duplicate/available/managed no-ops, one explicit-execution Seerr
  movie POST and identity read-back with sanitized audit evidence. All 60 local
  tests pass (37 existing plus 23 new). Read-only Seerr 3.4.1 discovery verified
  the existing standard default Radarr service and profile/root validity.
  No real request, media-policy change, service/container change or DB write
  occurred. Cross-process replay requires orchestrator serialization and
  retained uncertain-outcome receipts; no exactly-once guarantee is claimed.
  Live acceptance on 2026-09-26 used clean checkout 0382d1c, explicit normalized
  mode and transient official Node v24.21.0. Heretik (2024) returned one
  Movie Intelligence candidate (CSFD 1419147, no TMDb/IMDb) and no Radarr candidate.
  TMDb 111 returned no Movie Intelligence ID candidate and one Radarr Scarface
  (1983), IMDb tt0086250, monitored=true, has_file=true, profile 9 UHD Bluray + WEB.
  Both reads exited 0 and returned single_source_only without fabricated matching.
  This does not prove absence of a differently identified personal-state record.
  DB/WAL/SHM hashes and persistent container IDs were unchanged; host Node stayed
  v22.22.1. No credentials were persisted, no service installed and no ARR/Seerr
  write action performed. The September 15 unattended CSFD run is verified:
  timer trigger 04:15:02 UTC, successful service exit at 04:15:31 UTC, exit 0,
  journal completion confirmed. Timer active/waiting; next observed October 1
  at 04:15 UTC. The following implementation history predates live acceptance.
  Issue 11 adds explicit normalized SQLite mode for movies, user_movies and
  external_ids, mapping my_rating and validating csfd/tmdb/imdb identifiers.
  All 26 original tests plus 11 normalized-schema tests pass locally. The
  supplied schema contract was used without homelab contact or deployment.
  Issue 9 is implemented and merged through PR 10 at merge commit dd795e3.
  tools/movie-intelligence now provides a source-separated get_movie_status
  contract, read-only SQLite and GET-only Radarr adapters, stable-ID identity
  rules and deterministic local tests; 26 tests passed in the implementation
  environment. At that implementation milestone it was component-tested, not
  live-accepted; Issue 13 above now verifies the live read path. No homelab access or changes were performed for
  that milestone. The previously identified single-table compatibility gap is
  addressed by Issue 11's explicit fixed normalized adapter and exact-schema
  fixture tests. Live access remains outside this implementation scope.
  The notebook-to-desktop migration is
  formally closed by owner acceptance. The desktop homelab is the production
  platform; remaining hardlink, rollback disk, image-pinning, backup and
  monitoring items are post-migration follow-up, not closure blockers. Movie
  Intelligence is operational on the homelab with SQLite media.db in WAL mode
  and a verified state of 682 unique movies: 556 watched/rated, 126 watchlist
  and 0 overlap. The one-time private ČSFD watchlist bootstrap is complete.
  Public ČSFD ratings sync is verified and a systemd oneshot service plus
  persistent twice-monthly timer were enabled for the 1st and 15th at 04:15 in
  the host systemd timezone. A local read-only lookup_movie.mjs tool is verified
  against media.db. Credential-safe local Radarr API access is verified, and
  get_radarr_movie_status.mjs was verified in both negative and positive cases:
  Heretik was absent from Radarr after removal, while Scarface (1983, TMDb 111,
  IMDb tt0086250) returned monitored=true, has_file=true and profile
  "UHD Bluray + WEB". Seerr 3.4.1 has since been accepted end-to-end by the
  media workstream as the human request gateway and is a candidate future
  controlled write gateway for agents. The September 15 unattended CSFD run
  has now been checked successfully under Issue 13.

exact_next_action: >
  Present the private 39-entry proposal for a separately authorized Trakt
  batch. Recheck history immediately before any later write and keep the
  unresolved Plex-link item excluded. Do not execute the batch in this task.

blockers: []

dependencies:
  - project: "Homelab & Media Stack"
    workstream: "Plex, Kometa & Media Automation"
    dependency: >
      Media Automation owns Plex UX, Bazarr/subtitle policy, watched/history
      design, My Cinema, Trakt/PlexTraktSync, Kometa behavior and Seerr
      deployment/media policy. Seerr is accepted end-to-end and may later be
      wrapped by this workstream as a controlled request gateway.
  - component: "Movie Intelligence"
    dependency: >
      SQLite media.db, ČSFD ingestion, scheduled sync, lookup_movie.mjs and the
      verified read-only Radarr wrapper provide the current live foundation.
  - component: "Stable movie identity"
    dependency: >
      Before any agent write action, entity matching must prefer stable external
      IDs such as TMDb and must return ambiguous/unresolved instead of silently
      pairing title-only matches.
  - component: "Normalized SQLite adapter"
    dependency: >
      Issue 11 provides the fixed multi-table read path, live-accepted under
      Issue 13 using explicit normalized mode and a transient supported runtime.

important_open_loops:
  - "Whiplash request/import/Plex visibility are accepted; preserve replay/uncertainty audit evidence for future actions."
  - "Keep the local Movie Intelligence DB as the durable internal personal-state layer while the media workstream designs Plex/Trakt watched-history responsibilities."
  - "Use SQLite-aware backup semantics for online backups; avoid naive copy while WAL writes may be active."
  - "Keep private ČSFD exports, API keys and live credentials out of the public repository."
  - "Future TV/series ingestion should use a separate SerialZone path and later Sonarr/Seerr integration."
  - "Retire/unmount the old rollback source disk when convenient."
  - "Replace/remove any temporary migration-version override and finalize permanent image pin/update policy."
  - "Continue backup/restore hardening and infrastructure monitoring as post-migration operations."

stale_or_unknown:
  - "Current attachment/disposition of the old rollback source disk has not been freshly verified."
  - "Current temporary migration-version override status has not been freshly verified."

portfolio:
  milestone: true
  signal: >
    The project has moved beyond migration into an agent-control-plane phase:
    a repository-backed read contract, source-agnostic Movie Intelligence
    database, scheduled ČSFD ingestion and credential-safe Radarr visibility are
    in place. Schema review caught the live normalized-database mismatch before
    deployment, preserving the read-only safety boundary and creating a clean
    path to a fixed adapter, live acceptance and then controlled Seerr actions.

