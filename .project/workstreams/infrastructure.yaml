  Both reads exited 0 and returned single_source_only without fabricated matching.
  This does not prove absence of a differently identified personal-state record.
  DB/WAL/SHM hashes and persistent container IDs were unchanged; host Node stayed
  v22.22.1. No credentials were persisted, no service installed and no ARR/Seerr
