schema_version: "0.2"

state_scope: "project_rollup"

project:
  name: "Homelab & Media Stack"
  owner: "Core Project Brain rollup"

status: "active"
phase: "post-migration-media-intelligence-and-my-cinema"

current_gate: >
  Desktop migration remains formally closed. The freshest Media Automation work
  is now My Cinema / historical-library behavior: the Heretic archive pilot is
  server-accepted with valid inherited historical watch state preserved, while
  Samsung poster/details confirmation remains pending. Reacquisition is
  component-tested and runtime-ready for dry planning but is not live-write
  accepted. Separately, the Mortgully Trakt delivery remains durably ambiguous
  and must not be retried automatically. Infrastructure still has a read-only
  39-entry history proposal that requires separate authorization before any write.

current_state: >
  The desktop is the production Homelab. Core media foundations are accepted:
  Plex/ARR/Usenet operation, public-indexer torrent cleanup, Tautulli/ledger
  foundations, Kometa Phase 2A scheduled rotation and the Movie Intelligence
  layer. Media Automation has additionally built and verified the first reversible
  My Cinema historical archive path: one Heretic placeholder is present in the
  isolated archive library, correct identity/poster/metadata/file accessibility
  are verified, inherited watched metadata was matched to a pre-existing
  canonical Plex history event, and no watched-state mutation was performed.
  Reacquisition has a bounded dry-run controller with durable receipts and an
  explicit execute gate, but no user-facing trigger or live reacquisition write
  has been accepted. The Walter Mitty Samsung buffering issue remains unresolved
  and is isolated from the separately accepted Radarr audio compatibility policy.
  Infrastructure / Agent Control Plane remains independently at the 39-entry
  read-only history proposal boundary.

exact_next_action: >
  Media Automation should obtain only the pending Heretic Samsung poster/details
  confirmation and keep live reacquisition execution paused. Do not retry the
  ambiguous Mortgully Trakt delivery. Infrastructure may present, but not execute,
  its 39-entry history proposal unless separately authorized.

blockers:
  - "Mortgully Trakt delivery remains durably ambiguous after exactly one POST; automatic retry is forbidden."
  - "My Cinema reacquisition has no accepted live-write path or deployed user-facing trigger yet."
  - "The 39-entry infrastructure history proposal requires separate explicit authorization before any write."
  - "Walter Mitty Samsung buffering root cause remains unknown; do not treat the accepted Radarr audio policy as a playback fix."

dependencies:
  - component: "Plex / Movie Intelligence identity and historical watch evidence"
    dependency: >
      My Cinema archive and reacquisition depend on canonical TMDb/IMDb matching,
      scoped Plex watched provenance, media.db as the owned historical state and
      the existing Media Automation policy. Ambiguous identity or history must not
      be replaced with invented matches or watched events.
  - component: "Media Automation / Trakt delivery controls"
    dependency: >
      The original Mortgully history POST remains ambiguous after one attempt.
      Any later delivery decision depends on classifying its original sanitized
      audit; no automatic retry is authorized.
  - component: "Infrastructure historical cohort approval"
    dependency: >
      The Infrastructure workstream has 39 read-only history proposals out of
      40 qualified candidates, with one unresolved Plex link excluded. Separate
      explicit authorization and a fresh pre-write check are prerequisites to
      any later history batch.

important_open_loops:
  - "Obtain Heretic Samsung poster/details confirmation; server acceptance alone does not prove client UX acceptance."
  - "Keep My Cinema reacquisition dry-run-only until a separately accepted live write and normal user-facing request trigger exist."
  - "Inspect only the original Mortgully Trakt POST audit and preserve ambiguous/no-retry state unless definitive non-creation evidence is obtained."
  - "Present the Infrastructure 39-entry history proposal for separate authorization; keep the one unresolved Plex-link item excluded and do not execute the batch implicitly."
  - "Walter Mitty Samsung buffering remains unexplained; the separately accepted Radarr audio policy is not a playback fix."
  - "Continue post-migration backup/restore, monitoring, image-policy and rollback-disk housekeeping as follow-up operations, not migration blockers."
  - "Media workstream verification metadata still shows 2026-10-19 despite newer 2026-10-22 evidence; let the specialist owner reconcile it without inventing freshness."

workstreams:
  - id: "infrastructure"
    path: ".project/workstreams/infrastructure.yaml"
    owner: "Homelab Infrastructure specialist chat"
  - id: "media-automation"
    path: ".project/workstreams/media-automation.yaml"
    owner: "Plex, Kometa & Media Automation specialist chat"

rollup_policy:
  specialist_writes_root: false
  generated_from:
    - ".project/workstreams/infrastructure.yaml"
    - ".project/workstreams/media-automation.yaml"

portfolio:
  milestone: true
  signal: >
    Homelab has progressed from migration into a bounded personal media platform:
    durable Movie Intelligence, scheduled media automation, accepted Kometa
    discovery, guarded request/reacquisition controls and a reversible historical
    archive path that preserves provenance and refuses uncertain writes.

verification:
  last_verified: "2026-10-22"
  sources:
    - ".project/workstreams/infrastructure.yaml (last verified 2026-10-05)"
    - ".project/workstreams/media-automation.yaml (contains verified Media milestones through 2026-10-22; its top-level verification metadata still says 2026-10-19 and should be refreshed by the specialist owner)"

sync:
  status: "synced"
  storage: ".project/state.yaml"
